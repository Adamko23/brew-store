[package]
name = "brew-store"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A local-first Homebrew desktop manager, written in Rust"
license = "MIT"
repository = "https://github.com/Adamko23/brew-store"
homepage = "https://github.com/Adamko23/brew-store"
readme = "README.md"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["wgpu", "tokio", "crisp", "advanced", "image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["process", "io-util", "sync", "time", "fs", "macros", "rt-multi-thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.3"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSApplication", "NSResponder", "NSImage", "NSMenu", "NSMenuItem"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["NSData", "NSThread", "NSLocale", "NSArray", "NSString", "NSBundle"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"
strip = true
